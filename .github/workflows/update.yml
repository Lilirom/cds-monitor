name: Update CDS activity

on:
  schedule:
    - cron: "0 7 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build activity.json
        run: python monitor.py

      - name: Commit if the data changed
        run: |
          git config user.name  "cds-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add activity.json state
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "Activity update $(date -u +%Y-%m-%d)"
            git push
          fi
